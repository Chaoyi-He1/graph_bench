[project]
name = "tracegraph-bench"
version = "0.0.1"
description = "Causal-graph-grounded, execution-free evaluation of conversational debugging agents built from real public support threads (working title)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracegraph_bench"]
